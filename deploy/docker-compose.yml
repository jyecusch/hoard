name: hoard

# Production deployment for Hoard. See deploy/README.md for the runbook.
#
# Requires a .env file next to this compose file (copy .env.example).
# Note: VITE_JAZZ_APP_ID / VITE_JAZZ_SERVER_URL are baked into the client
# bundle at BUILD time (they are Vite build args, not runtime env) — if you
# change JAZZ_APP_ID or the sync origin you must rebuild the app image.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        VITE_JAZZ_APP_ID: ${JAZZ_APP_ID:?set JAZZ_APP_ID in .env}
        VITE_JAZZ_SERVER_URL: ${SYNC_ORIGIN:-https://${SYNC_DOMAIN:-sync.${DOMAIN}}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_DB_DIR: /data
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${APP_ORIGIN:-https://${DOMAIN}}
      # AI capture enrichment (optional — app works without it).
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - auth-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/auth/ok').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  jazz:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jazz
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JAZZ_APP_ID: ${JAZZ_APP_ID:?set JAZZ_APP_ID in .env}
      JAZZ_ADMIN_SECRET: ${JAZZ_ADMIN_SECRET:?set JAZZ_ADMIN_SECRET in .env}
      # Validate client JWTs against Better Auth's JWKS, served by the app
      # container. External-JWT auth only — local-first auth stays disabled
      # (NODE_ENV=production and no --allow-local-first-auth).
      JAZZ_JWKS_URL: http://app:3000/api/auth/jwks
    volumes:
      - jazz-data:/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4200/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      SYNC_DOMAIN: ${SYNC_DOMAIN:-sync.${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - jazz

volumes:
  # Better Auth sqlite database (users/sessions/JWKS keys). Back this up.
  auth-data:
  # Jazz sync server data dir (all inventory data + blobs). Back this up.
  jazz-data:
  # Caddy TLS certificates / ACME state.
  caddy-data:
  caddy-config:
